<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>縣界王 台灣版</title>
<meta name="description" content="隨機抽出一個縣市，60 秒內描出它的邊界，依與實際縣市界的一致率計分。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f1ea; --ink:#1f3a3d; --muted:#7b8a8a; --line:#ddd6c8;
  --accent:#d8603f; --accent-d:#b64a2d; --card:#fffaf0; --red:#e0404a; --blue:#2f6fe0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:center;height:52px;border-bottom:1px solid var(--line);background:#fff;font-weight:800;font-size:19px;letter-spacing:.08em;flex:none}
header small{font-weight:500;color:var(--muted);margin-left:10px;font-size:12px;letter-spacing:0}
main{flex:1;display:flex;min-height:0}
aside{width:300px;flex:none;padding:18px;overflow:auto;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#dfe7e8}
#draw{position:absolute;inset:0;z-index:500;touch-action:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:800;font-size:18px;color:#fff;background:var(--accent);box-shadow:0 4px 0 var(--accent-d);display:flex;justify-content:space-between;align-items:center;width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-d)}
.btn.sec{background:var(--ink);box-shadow:0 4px 0 #0f2224}
.btn:disabled{opacity:.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--accent-d)}
select{font:inherit;font-size:15px;font-weight:700;padding:9px 10px;border:2px solid #e5a08a;border-radius:10px;background:var(--card);color:var(--ink)}
select:disabled{opacity:.55}
p.d{margin:0;font-size:13px;line-height:1.7;color:#4c5f61}
.stats{display:flex;gap:26px;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--ink);font-weight:700}
.stats b i{font-style:normal;font-size:11px;color:var(--muted);margin-left:2px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-size:12px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.tool span{font-size:18px;line-height:1}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool.danger{color:var(--accent-d);border-color:#e5a08a;background:#fdf0ea}
.tool:disabled{opacity:.4;cursor:default}
hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}
.kv{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.kv b{color:var(--ink)}
#q{position:absolute;z-index:700;top:12px;left:12px;right:60px;background:var(--card);border-radius:12px;box-shadow:0 2px 10px #0002;padding:10px 16px 0;overflow:hidden;pointer-events:none}
#q .row{display:flex;justify-content:space-between;align-items:baseline}
#qname{font-size:24px;font-weight:800}
#qsub{font-size:12px;color:var(--muted);margin-left:8px;font-weight:500}
#qtime{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
#qtime.urgent{color:var(--red)}
#bar{height:4px;background:var(--accent);margin:8px -16px 0 -16px;transform-origin:left}
#toast{position:absolute;z-index:700;bottom:26px;left:50%;transform:translateX(-50%);background:#fffffff0;border-radius:99px;padding:7px 16px;font-size:12px;color:#4c5f61;box-shadow:0 2px 8px #0002;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.rank{display:flex;align-items:center;gap:14px;border:2px solid;border-radius:14px;padding:10px 12px;background:var(--card)}
.rank .l{flex:none;width:64px;height:64px;border-radius:10px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.rank .l small{font-size:10px;font-weight:700;opacity:.9;margin-bottom:2px}
.rank .l b{font-size:38px}
.rank .t{font-size:17px;font-weight:800}
.res{background:var(--card);border-radius:14px;padding:14px;text-align:center}
.res .nm{font-size:13px;color:var(--muted)}
.res .big{font-size:50px;font-weight:800;line-height:1.1;color:var(--accent-d);font-variant-numeric:tabular-nums}
.res .big small{font-size:20px}
.res .pt{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.res .pt small{color:var(--muted);font-weight:500}
.res .sub{display:flex;justify-content:space-around;margin-top:10px;font-size:11px;color:var(--muted)}
.res .sub b{display:block;font-size:17px;color:var(--ink)}
.legend{font-size:12px;color:#4c5f61;display:flex;gap:16px;align-items:center;justify-content:center}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid;margin-right:5px;vertical-align:3px}
.legend i.b{border-top-style:dashed;border-color:var(--blue)}
.legend i.r{border-color:var(--red)}
.leaflet-control-attribution{font-size:9px}
.credit{margin:auto 0 0;padding-top:10px;font-size:11px;line-height:1.6;color:var(--muted)}
.credit a{color:var(--accent-d);font-weight:700}
#share{position:fixed;inset:0;z-index:2000;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
#share .card{-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:16px;padding:14px;max-width:560px;width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto}
#share img{flex:none;width:100%;max-height:42vh;object-fit:contain;border-radius:10px;background:#fff}
#share .row{flex:none;display:flex;gap:8px;flex-wrap:wrap}
#share .row .btn{flex:1;min-width:120px;font-size:15px;padding:12px 14px}
#share textarea{flex:none;width:100%;font:inherit;font-size:13px;line-height:1.6;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;resize:none}
#share .tip{font-size:12px;color:var(--muted);text-align:center;margin:0}
.help{display:flex;flex-direction:column;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.help h3{margin:0 0 2px;font-size:13px;color:var(--ink)}
.help .r{display:flex;align-items:center;gap:8px;font-size:13px;color:#33484a}
.help .r .k{flex:none;min-width:92px;display:flex;gap:4px;flex-wrap:wrap}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
  background:linear-gradient(#fff,#efe9db);border:1px solid #c7bea9;border-bottom-width:4px;border-radius:7px;box-shadow:0 1px 0 #fff inset}
kbd.w{min-width:64px}
kbd.m{font-family:inherit}
kbd.w,kbd.m{font-family:inherit;letter-spacing:.02em}
@media (max-width:760px){
  main{flex-direction:column-reverse}
  aside{width:auto;max-height:46vh;border-right:0;border-top:1px solid var(--line);padding:12px;gap:10px}
  #qname{font-size:19px}
  #q{right:56px}
  .help{display:none}                                  /* 手機操作直覺，不顯示操作說明 */
  /* 作答中：只留「提交」與工具列，把空間讓給地圖 */
  body[data-panel="play"] aside{padding:8px 10px;gap:8px;max-height:none}
  body[data-panel="play"] .credit,
  body[data-panel="play"] #settings,
  body[data-panel="play"] #stats,
  body[data-panel="play"] #p-play hr,
  body[data-panel="play"] #p-play .kv{display:none!important}
  body[data-panel="play"] #p-play{gap:8px!important}
  body[data-panel="play"] #b-submit{padding:11px 16px;font-size:16px;box-shadow:0 3px 0 var(--accent-d)}
  body[data-panel="play"] .tools{grid-template-columns:repeat(6,1fr);gap:5px}
  body[data-panel="play"] .tool{padding:6px 0;font-size:10px;gap:1px}
  body[data-panel="play"] .tool span{font-size:16px}
  /* 結果畫面：兩個按鈕並排放最上面，設定列移到最下面 */
  body[data-panel="reveal"] #settings{order:9}
  body[data-panel="reveal"] #p-reveal{flex-direction:row!important;flex-wrap:wrap;gap:8px!important}
  body[data-panel="reveal"] #p-reveal>*{width:100%}
  body[data-panel="reveal"] #p-reveal>.btn{order:-1;width:calc(50% - 4px);padding:11px 12px;font-size:15px}
}
</style>
</head>
<body>
<header>縣界王<small>台灣版・一題決勝</small></header>
<main>
<aside>
  <!-- 設定（作答中鎖定） -->
  <div id="settings" style="display:flex;gap:10px">
    <label class="f" style="flex:1">出題範圍
      <select id="o-region">
        <option value="all">全台灣出題（19 縣市）</option>
        <option value="north">北部出題</option>
        <option value="central">中部出題</option>
        <option value="south">南部出題</option>
        <option value="east">東部出題</option>
      </select>
    </label>
    <label class="f" style="flex:1">判定寬鬆度
      <select id="o-tol">
        <option value="10">簡單・10 km</option>
        <option value="5" selected>普通・5 km</option>
        <option value="2">嚴格・2 km</option>
      </select>
    </label>
  </div>

  <!-- 開始前 -->
  <section id="p-menu" class="panel" style="display:flex;flex-direction:column;gap:14px">
    <p class="d">隨機抽出一個縣市，<b>60 秒內</b>在地圖上描出它的邊界，依與實際縣市界的一致率計分，滿分 10 萬點。海岸線不用畫、海上的線不計分。</p>
    <div class="help" data-help></div>
    <button class="btn" id="b-start">開始遊戲 <span>→</span></button>
  </section>

  <!-- 作答中 -->
  <section id="p-play" class="panel hidden" style="flex-direction:column;gap:14px">
    <button class="btn" id="b-submit">在此提交 <span>→</span></button>
    <hr>
    <div class="stats" id="stats"><div>畫下的線<b id="s-n">0<i>條</i></b></div><div>距離<b id="s-km">0<i>km</i></b></div></div>
    <hr>
    <div class="tools">
      <button class="tool on" data-mode="draw"><span>✎</span>描繪</button>
      <button class="tool" data-mode="pan"><span>✥</span>移動</button>
      <button class="tool" data-mode="erase"><span>⌫</span>橡皮擦</button>
      <button class="tool danger" id="b-clear"><span>🗑</span>全部清除</button>
      <button class="tool" id="b-undo"><span>↶</span>復原</button>
      <button class="tool" id="b-fit"><span>⌖</span>回到全圖</button>
    </div>
    <hr>
    <div class="kv"><span>此縣市個人最佳</span><b id="s-best">—</b></div>
    <div class="help" data-help></div>
  </section>

  <!-- 結果 -->
  <section id="p-reveal" class="panel hidden" style="flex-direction:column;gap:14px">
    <div class="kv"><span id="r-name"></span><span id="r-tol"></span></div>
    <div class="rank" id="r-rank"><div class="l"><small>等級</small><b id="r-letter"></b></div><div class="t" id="r-title"></div></div>
    <div class="res">
      <div class="nm">一致率</div>
      <div class="big" id="r-pct">0.0<small>%</small></div>
      <div class="pt"><span id="r-pts">0</span> <small>點 / 100,000 點</small></div>
      <div class="sub"><div>精準度<b id="r-pre"></b></div><div>涵蓋率<b id="r-cov"></b></div><div>個人最佳<b id="r-best"></b></div></div>
    </div>
    <div class="legend"><span><i class="r"></i>你的線</span><span><i class="b"></i>正確縣市界</span></div>
    <button class="btn" id="b-again">再玩一題 <span>→</span></button>
    <button class="btn sec" id="b-share">分享結果圖片 <span>↗</span></button>
  </section>
  <p class="credit">靈感來自日本遊戲<a href="https://kskdazegames.com/games/kenkyo" target="_blank" rel="noopener">「県境王」（KSKだぜGAMES）</a>。本站為非官方的致敬作品，玩法與判定規則參考原作，程式、資料與介面為另外實作。</p>
</aside>

<div id="mapwrap">
  <div id="map"></div>
  <canvas id="draw"></canvas>
  <div id="q" class="hidden"><div class="row"><div><span id="qname"></span><span id="qsub"></span></div><div id="qtime"></div></div><div id="bar"></div></div>
  <div id="toast" class="hidden"></div>
</div>
</main>
<div id="share" class="hidden"><div class="card">
  <img id="share-img" alt="分享圖片">
  <textarea id="sh-text" rows="12" readonly></textarea>
  <div class="row">
    <button class="btn" id="sh-share">分享 <span>↗</span></button>
    <button class="btn sec" id="sh-dl">下載圖片 <span>↓</span></button>
    <button class="btn sec" id="sh-copy">複製圖片 <span>⧉</span></button>
    <button class="btn sec" id="sh-copytext">複製文字 <span>⧉</span></button>
  </div>
  <button class="btn sec" id="sh-close" style="justify-content:center">關閉</button>
  <p class="tip">圖片包含你的線、正解、等級、評語與全部分數；文字含兩個遊戲的標題與網址</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/counties.js"></script>
<script>
(() => {
'use strict';
const D = window.TW_DATA;
const REGIONS = {
  north: ['基隆市','臺北市','新北市','桃園市','新竹市','新竹縣','苗栗縣'],
  central: ['臺中市','彰化縣','南投縣','雲林縣'],
  south: ['嘉義市','嘉義縣','臺南市','高雄市','屏東縣'],
  east: ['宜蘭縣','花蓮縣','臺東縣'],
};
REGIONS.all=[...REGIONS.north,...REGIONS.central,...REGIONS.south,...REGIONS.east];   // 題庫不含離島（澎湖、金門、連江）
const ROUND_SEC = 60;
const MAIN_BOUNDS = [[21.8,119.95],[25.45,122.15]];
const $ = id => document.getElementById(id);

/* ---------- 操作說明（待機與作答中共用） ---------- */
const HELP=[
  [['滾輪'],'縮放地圖（也可用雙指）'],
  [['D'],'描繪'],
  [['F'],'移動地圖'],
  [['E'],'橡皮擦（點到線就擦掉）'],
  [['Z'],'復原上一條線'],
  [['Enter'],'提交答案'],
];
document.querySelectorAll('[data-help]').forEach(el=>{
  el.innerHTML='<h3>操作方式</h3>'+HELP.map(([k,t])=>`<div class="r"><span class="k">${k.map(x=>`<kbd class="${x.length>1?'w':''} ${x==='滾輪'?'m':''}">${x==='滾輪'?'滾輪':x}</kbd>`).join('')}</span><span>${t}</span></div>`).join('');
});

/* ---------- 地圖 ---------- */
const map = L.map('map',{zoomControl:false,minZoom:7,maxZoom:14,zoomSnap:0.25,doubleClickZoom:false,worldCopyJump:false});
L.control.zoom({position:'topright'}).addTo(map);
map.fitBounds(MAIN_BOUNDS);
const SITE_URL='gotou-akane.github.io/taiwan-kenkyo';
const SITE_FULL='https://'+SITE_URL+'/';
const ORIG_TITLE='県境王', ORIG_MAKER='KSKだぜGAMES', ORIG_URL='https://kskdazegames.com/games/kenkyo';
const ATTR_PAGE='地形：AWS Open Data Terrain Tiles（SRTM、GMTED2010 資料由美國地質調查局 USGS 提供；ETOPO1 資料由 NOAA NCEI 提供）｜縣市界：內政部國土測繪中心「鄉(鎮、市、區)界線」（本站合併並簡化）｜玩法靈感：<a href="'+ORIG_URL+'" target="_blank" rel="noopener">KSKだぜGAMES「県境王」</a>';
const ATTR_IMG=['地形：AWS Open Data Terrain Tiles（SRTM、GMTED2010 資料由美國地質調查局 USGS 提供；ETOPO1 資料由 NOAA NCEI 提供）','縣市界：內政部國土測繪中心「鄉(鎮、市、區)界線」（本站合併並簡化）','玩法靈感：KSKだぜGAMES「県境王」｜本圖非 USGS、NOAA、內政部或前述單位所背書'];
/* 地形底圖：AWS Open Data「Terrain Tiles」(Terrarium 高程編碼)，在瀏覽器端即時計算山影與高度色。
   高程來源：SRTM、GMTED2010（USGS）、ETOPO1（NOAA）。 */
const RAMP=[[0,[228,233,203]],[300,[208,216,170]],[1000,[192,174,130]],[2000,[164,134,104]],[3500,[134,108,98]]];
function tint(e){
  for(let i=1;i<RAMP.length;i++){
    if(e<=RAMP[i][0]){const [e0,c0]=RAMP[i-1],[e1,c1]=RAMP[i],t=(e-e0)/(e1-e0);return c0.map((v,k)=>v+(c1[k]-v)*t)}
  }
  return RAMP[RAMP.length-1][1];
}
const SEA=[214,226,229], ALT=Math.PI*40/180, AZ=Math.PI*315/180, EXAG=2.4;
const LX=Math.cos(ALT)*Math.sin(AZ), LY=Math.cos(ALT)*Math.cos(AZ), LZ=Math.sin(ALT);
const Hillshade=L.GridLayer.extend({
  createTile(coords,done){
    const c=document.createElement('canvas'); c.width=c.height=256;
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{
      const g=c.getContext('2d',{willReadFrequently:true}); g.drawImage(img,0,0);
      const src=g.getImageData(0,0,256,256), px=src.data, el=new Float32Array(65536);
      for(let i=0;i<65536;i++)el[i]=px[i*4]*256+px[i*4+1]+px[i*4+2]/256-32768;
      const n=Math.PI-2*Math.PI*(coords.y+.5)/2**coords.z, lat=Math.atan(Math.sinh(n));
      const cell=40075016.686*Math.cos(lat)/(256*2**coords.z);
      const at=(x,y)=>el[Math.min(255,Math.max(0,y))*256+Math.min(255,Math.max(0,x))];
      for(let y=0;y<256;y++)for(let x=0;x<256;x++){
        const i=(y*256+x)*4, e=el[y*256+x];
        let rgb=SEA;
        if(e>0){
          const a=at(x-1,y-1),b=at(x,y-1),cc=at(x+1,y-1),d=at(x-1,y),f=at(x+1,y),gg=at(x-1,y+1),h=at(x,y+1),ii=at(x+1,y+1);
          const dx=((cc+2*f+ii)-(a+2*d+gg))/(8*cell), dn=-((gg+2*h+ii)-(a+2*b+cc))/(8*cell);
          const nx=-EXAG*dx, ny=-EXAG*dn, inv=1/Math.sqrt(nx*nx+ny*ny+1);
          const shade=Math.max(0,(nx*LX+ny*LY+LZ)*inv)/LZ;      // 平地 = 1
          const k=.5+.5*Math.min(shade,1.6), t=tint(e);
          rgb=[t[0]*k,t[1]*k,t[2]*k];
        }
        px[i]=rgb[0];px[i+1]=rgb[1];px[i+2]=rgb[2];px[i+3]=255;
      }
      g.putImageData(src,0,0); done(null,c);
    };
    img.onerror=()=>done(null,c);
    img.src=`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${coords.z}/${coords.x}/${coords.y}.png`;
    return c;
  }
});
const hill=new Hillshade({maxNativeZoom:12,maxZoom:14,minZoom:7,tileSize:256,
  attribution:ATTR_PAGE}).addTo(map);
D.coast.forEach(ring => L.polyline(ring.map(p=>[p[1],p[0]]),{color:'#3b6f86',weight:1.4,opacity:.85,interactive:false}).addTo(map));

/* ---------- 畫布 ---------- */
const cv = $('draw'), cx = cv.getContext('2d');
map.getContainer().appendChild(cv);   // 放進地圖容器，滾輪與雙指縮放才會傳給 Leaflet
const dpr = window.devicePixelRatio||1;
function sizeCanvas(){
  const r = $('mapwrap').getBoundingClientRect();
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  cv.style.width = r.width+'px'; cv.style.height = r.height+'px';
  map.invalidateSize(); redraw();
}
window.addEventListener('resize',sizeCanvas);

/* ---------- 狀態 ---------- */
let state='menu', mode='draw';
let strokes=[], history=[], cur=null;
let name=null, tStart=0, timer=null, reveal=false, lastResult=null, revealRAF=0;

function show(panel){

  $('o-region').disabled=$('o-tol').disabled=(panel==='play');
  document.body.dataset.panel=panel;

function toast(t,ms=3500){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.add('hidden'),ms)}
function applyPE(){
  cv.style.pointerEvents=(state==='play'&&mode!=='pan')?'auto':'none';
  cv.style.cursor=mode==='draw'?'crosshair':mode==='erase'?'cell':'';
}
function setMode(m){
  mode=m;
  document.querySelectorAll('.tool[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  applyPE();
}
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
};

/* ---------- 繪製 ---------- */
const pt=ll=>map.latLngToContainerPoint(ll);
function redraw(){
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.clearRect(0,0,cv.width,cv.height);
  cx.lineCap='round';cx.lineJoin='round';
  if(reveal&&name){
    cx.strokeStyle='#2f6fe0';cx.lineWidth=3;cx.setLineDash([9,7]);
    for(const l of D.counties[name].lines){
      cx.beginPath();
      l.forEach((c,i)=>{const p=pt([c[1],c[0]]);i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y)});
      cx.stroke();
    }
    cx.setLineDash([]);
  }
  cx.strokeStyle='#e0404a';cx.lineWidth=reveal?2.5:3;
  for(const s of (cur?strokes.concat([cur]):strokes)){
    cx.beginPath();
    s.forEach((ll,i)=>{const p=pt(ll);i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y)});
    cx.stroke();
  }
}
map.on('move zoom viewreset resize',redraw);

/* ---------- 輸入 ---------- */
const evLL=e=>{const r=cv.getBoundingClientRect();return map.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top])};
const evPt=e=>{const r=cv.getBoundingClientRect();return L.point(e.clientX-r.left,e.clientY-r.top)};
let lastPt=null, erased=false;
// 畫布在地圖容器內：繪圖／橡皮擦時，擋住按下事件，避免 Leaflet 把它當成拖曳平移（滾輪、雙指縮放不受影響）
const drawing=()=>state==='play'&&mode!=='pan';
cv.addEventListener('mousedown',e=>{if(drawing())e.stopPropagation()});
cv.addEventListener('touchstart',e=>{if(drawing()&&e.touches.length===1)e.stopPropagation()},{passive:true});
cv.addEventListener('dblclick',e=>{if(drawing())e.stopPropagation()});
const touches=new Set();
cv.addEventListener('pointerdown',e=>{
  touches.add(e.pointerId);
  if(touches.size>1){cur=null;lastPt=null;redraw();return}   // 雙指：交給地圖縮放，並放棄這一筆
  if(state!=='play'||mode==='pan') return;
  cv.setPointerCapture(e.pointerId); lastPt=evPt(e);
  if(mode==='draw') cur=[evLL(e)]; else {erased=false;eraseAt(lastPt)}
});
cv.addEventListener('pointermove',e=>{
  if(!lastPt) return;
  const p=evPt(e);
  if(mode==='draw'&&cur){ if(p.distanceTo(lastPt)>2.5){cur.push(evLL(e));lastPt=p;redraw()} }
  else if(mode==='erase'){eraseAt(p);lastPt=p}
});
function endStroke(){
  if(!lastPt) return; lastPt=null;
  if(mode==='draw'&&cur){ if(cur.length>=2){pushHist();strokes.push(cur)} cur=null; update(); redraw() }
}
const up=e=>{touches.delete(e.pointerId);endStroke()};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function eraseAt(p){
  const keep=strokes.filter(s=>!s.some(ll=>pt(ll).distanceTo(p)<12));
  if(keep.length!==strokes.length){ if(!erased){pushHist();erased=true} strokes=keep; update(); redraw() }
}
function pushHist(){history.push(strokes.slice());if(history.length>60)history.shift()}
function undo(){ if(state!=='play'||!history.length) return; strokes=history.pop(); update(); redraw() }
function clearAll(){ if(state!=='play'||!strokes.length) return; pushHist(); strokes=[]; update(); redraw() }

/* ---------- 評分 ----------
   與原版「県境王」相同的判定規則（以本專案自行實作）：
   - 取樣間距 0.35 km；2.5 km 內全額計分，超過後依高斯曲線遞減，3×寬鬆度＋2.5 km 外為 0。
   - 一致率 = min(精準度 × 涵蓋率 × 墨水效率² × 界外懲罰, 整體形狀上限)，滿分 100,000 點。 */
const FULL=2.5, STEP=.35;
const COS=Math.cos(23.8*Math.PI/180);
const proj=(lng,lat)=>[(lng-120.9)*111.32*COS,(lat-23.8)*110.574];  // → km
function lineKm(pts){let t=0;for(let i=1;i<pts.length;i++)t+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return t}
function samples(lines){
  const out=[];
  for(const pts of lines)for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(len<1e-5)continue;
    const n=Math.max(1,Math.ceil(len/STEP));
    for(let j=0;j<n;j++){const t=(j+.5)/n;out.push({x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,w:len/n,d:0})}
  }
  return out;
}
function nearest(from,to){ // 對 from 每點算到 to 的最短距離（km）
  for(const p of from){
    let best=Infinity;
    for(const q of to){const dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<best)best=d}
    p.d=Math.sqrt(best);
  }
}
function sim(d,tol,penalize){
  if(d<=FULL)return 1;
  if(d>=3*tol+FULL)return 0;
  const base=Math.exp(-.5*((d-FULL)/tol)**2);
  return penalize?base*Math.exp(-.5*(Math.max(0,d-tol)/(tol*.5))**2):base;
}
// 分區涵蓋：避免只把一小段畫得很細緻就掩蓋大片缺漏；四組位移網格平均。
function regional(pts,tol,shapeTol){
  if(!pts.length)return 0;
  let sum=0;
  for(const [ox,oy] of [[0,0],[.5,0],[0,.5],[.5,.5]]){
    const cells=new Map;
    for(const p of pts){
      const k=Math.floor(p.x/tol+ox)+','+Math.floor(p.y/tol+oy);
      const c=cells.get(k)||cells.set(k,{w:0,m:0}).get(k);
      c.w+=p.w; c.m+=p.w*Math.exp(-.5*(Math.max(0,p.d-shapeTol*.5)/(shapeTol*.6))**2);
    }
    let W=0,S=0;
    for(const c of cells.values()){const w=Math.min(tol,c.w);W+=w;S+=w*c.m/c.w}
    sum+=S/W;
  }
  return sum/4;
}
function score(county,tol,strokesLL){
  const target=samples(D.counties[county].lines.map(l=>l.map(c=>proj(c[0],c[1]))));
  const drawn=samples(strokesLL.map(s=>s.map(ll=>proj(ll.lng,ll.lat))));
  const zero={percent:0,points:0,precision:0,coverage:0};
  if(!drawn.length||!target.length)return zero;
  nearest(drawn,target); nearest(target,drawn);
  const edge=Math.exp(-.5*(Math.max(0,tol-FULL)/tol)**2);
  let pSum=0,dLen=0,cSum=0,tLen=0,outside=0;
  for(const p of drawn){const m=sim(p.d,tol,true);pSum+=p.w*m;dLen+=p.w;if(m<edge)outside+=p.w}
  for(const p of target){cSum+=p.w*sim(p.d,tol,false);tLen+=p.w}
  const precision=pSum/dLen, coverage=cSum/tLen;
  const ink=Math.min(1,1.2*cSum/dLen), outsidePenalty=1-.15*outside/dLen;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of target){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  const shapeTol=tol*Math.min(1,Math.max(.6,Math.max(x1-x0,y1-y0)/120));
  const shape=Math.min(regional(target,tol,shapeTol),regional(drawn,tol,shapeTol));
  const ceiling=.55+.45*Math.exp(-(((1-shape)/.067)**2));
  const match=Math.min(1,precision*coverage*ink*ink*outsidePenalty,ceiling);
  return{percent:Math.round(match*1000)/10,points:Math.round(match*100000),precision:precision*100,coverage:coverage*100};
}
function rankOf(pct,n){
  const s=/^(新竹|嘉義)/.test(n)?n:n.replace(/[縣市]$/,'');  // 短名：彰化、臺北；新竹、嘉義縣市同名，保留全名
  if(pct>=98)return{l:'S',t:`生是${s}人，死是${s}鬼`,c:'#d4a017'};
  if(pct>=90)return{l:'A',t:`名譽${n}民`,c:'#2e9d62'};
  if(pct>=60)return{l:'B',t:`具備進入${n}的基本資格`,c:'#2f6fe0'};
  if(pct>=55)return{l:'C',t:`對${n}的了解程度偏低`,c:'#8a8f3a'};
  if(pct>=35)return{l:'D',t:`不配當${s}人`,c:'#b8742a'};
  return{l:'E',t:`終身禁止進入${n}`,c:'#a8505a'};
}

/* ---------- 遊戲流程（一次一題） ---------- */
const HKEY='twkenkyo.history.v1', BKEY='twkenkyo.best.v2', PKEY='twkenkyo.prefs.v1';
function pick(region){ // 抽完前不重複；抽完後重置並避開上一題
  const eligible=REGIONS[region], hist=store.get(HKEY,{})[region]||{};
  const seen=new Set(hist.seen||[]);
  let cand=eligible.filter(n=>!seen.has(n)); const reset=!cand.length;
  if(reset)cand=eligible.filter(n=>n!==hist.last);
  if(!cand.length)cand=eligible;
  const n=cand[Math.floor(Math.random()*cand.length)];
  const all=store.get(HKEY,{});
  all[region]={seen:[...(reset?[]:eligible.filter(x=>seen.has(x))),n],last:n};
  store.set(HKEY,all);
  return n;
}
function fitCounty(n,pad=.25){
  const b=D.counties[n].bbox, dx=(b[2]-b[0])*pad+.01, dy=(b[3]-b[1])*pad+.01;
  map.fitBounds([[b[1]-dy,b[0]-dx],[b[3]+dy,b[2]+dx]]);
}
const fitStart=()=>map.fitBounds(MAIN_BOUNDS);
function startRound(){
  cancelAnimationFrame(revealRAF);
  const region=$('o-region').value;
  store.set(PKEY,{region,tol:$('o-tol').value});
  name=pick(region);
  state='play'; reveal=false; strokes=[]; history=[]; cur=null; lastResult=null;
  show('play');
  $('q').classList.remove('hidden');
  $('qname').textContent=name; $('qsub').textContent='一題決勝';
  const best=store.get(BKEY,{})[name];
  $('s-best').textContent=best==null?'—':best.toFixed(1)+'%';
  fitStart(); setMode('draw'); update(); redraw();
  tStart=performance.now(); clearInterval(timer); timer=setInterval(tick,40); tick();
  toast('描出這個縣市的邊界・海岸線不用畫、海上的線不計分・滾輪可縮放');
}
function tick(){
  const left=Math.max(0,ROUND_SEC-(performance.now()-tStart)/1000);
  $('qtime').textContent=left.toFixed(1)+' 秒';
  $('qtime').classList.toggle('urgent',left<=5);
  $('bar').style.transform=`scaleX(${left/ROUND_SEC})`;
  if(left<=0)submit();
}
function update(){
  $('s-n').innerHTML=strokes.length+'<i>條</i>';
  $('s-km').innerHTML=Math.round(strokes.reduce((t,s)=>t+lineKm(s.map(ll=>proj(ll.lng,ll.lat))),0))+'<i>km</i>';
  $('b-undo').disabled=!history.length; $('b-clear').disabled=!strokes.length;
}
function submit(){
  if(state!=='play') return;
  clearInterval(timer); state='reveal'; reveal=true; cur=null; lastPt=null;
  applyPE();
  const tol=+$('o-tol').value, r=score(name,tol,strokes);
  lastResult=r;
  const best=store.get(BKEY,{}), prev=best[name];
  if(!(prev>=r.percent)){best[name]=r.percent;store.set(BKEY,best)}
  const rk=rankOf(r.percent,name);
  $('q').classList.add('hidden');
  $('r-name').textContent=name+'的結果'; $('r-tol').textContent='寬鬆度 '+tol+' km';
  $('r-rank').style.borderColor=rk.c; $('r-rank').querySelector('.l').style.background=rk.c;
  $('r-letter').textContent=rk.l; $('r-title').textContent=rk.t;
  $('r-pre').textContent=r.precision.toFixed(1)+'%'; $('r-cov').textContent=r.coverage.toFixed(1)+'%';
  $('r-best').textContent=Math.max(prev||0,r.percent).toFixed(1)+'%';
  show('reveal'); fitCounty(name,.35); redraw();
  // 分數跳動動畫（2.1 秒）
  const t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, dur=reduce?700:2100;
  (function f(){
    const k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3);
    $('r-pct').innerHTML=(r.percent*e).toFixed(1)+'<small>%</small>';
    $('r-pts').textContent=Math.round(r.points*e).toLocaleString();
    if(k<1)revealRAF=requestAnimationFrame(f);
  })();
}
const TOL_LABEL={10:'簡單',5:'普通',2:'嚴格'};
const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif';
function getTile(z,x,y){return new Promise(res=>{const c=hill.createTile({x,y,z},()=>res(c))})}
async function buildShareImage(){
  const W=1080,H=1512, BX=40,BY=130,BW=1000,BH=700;
  const cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H; const g=cvs.getContext('2d');
  const tol=+$('o-tol').value, r=lastResult, rk=rankOf(r.percent,name);
  g.fillStyle='#f4f1ea'; g.fillRect(0,0,W,H);
  // 標題列
  g.fillStyle='#1f3a3d'; g.font=`800 54px ${FONT}`; g.textBaseline='alphabetic'; g.textAlign='left';
  g.fillText('縣界王 台灣版',BX,78);
  g.fillStyle='#7b8a8a'; g.font=`600 24px ${FONT}`; g.fillText('隨機抽縣市・限時描出邊界',BX,112);
  g.textAlign='right'; g.fillStyle='#b64a2d'; g.font=`800 54px ${FONT}`; g.fillText(name,W-BX,78); g.textAlign='left';

  // 地圖範圍：正解 ∪ 玩家的線
  const pts=[]; D.counties[name].lines.forEach(l=>l.forEach(c=>pts.push(L.latLng(c[1],c[0])))); strokes.forEach(st=>st.forEach(p=>pts.push(p)));
  let la0=90,la1=-90,lo0=999,lo1=-999;
  for(const p of pts){la0=Math.min(la0,p.lat);la1=Math.max(la1,p.lat);lo0=Math.min(lo0,p.lng);lo1=Math.max(lo1,p.lng)}
  const padLa=(la1-la0)*.1+.01, padLo=(lo1-lo0)*.1+.01; la0-=padLa;la1+=padLa;lo0-=padLo;lo1+=padLo;
  const crs=L.CRS.EPSG3857, P=(ll,z)=>crs.latLngToPoint(L.latLng(ll),z);
  const a7=P([la1,lo0],7), b7=P([la0,lo1],7);
  const zf=Math.log2(Math.min(BW/Math.abs(b7.x-a7.x),BH/Math.abs(b7.y-a7.y)))+7;
  const zt=Math.max(7,Math.min(12,Math.round(zf))), sc=Math.pow(2,zf-zt);
  const ctr=P([(la0+la1)/2,(lo0+lo1)/2],zt);
  const X=ll=>(P(ll,zt).x-ctr.x)*sc+BX+BW/2, Y=ll=>(P(ll,zt).y-ctr.y)*sc+BY+BH/2;

  g.save(); g.beginPath(); g.roundRect(BX,BY,BW,BH,22); g.clip();
  g.fillStyle='#d6e2e5'; g.fillRect(BX,BY,BW,BH);
  const x0=Math.floor((ctr.x-BW/2/sc)/256), x1=Math.floor((ctr.x+BW/2/sc)/256), y0=Math.floor((ctr.y-BH/2/sc)/256), y1=Math.floor((ctr.y+BH/2/sc)/256);
  const jobs=[]; for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)jobs.push(getTile(zt,tx,ty).then(c=>({c,tx,ty})));
  for(const {c,tx,ty} of await Promise.all(jobs)){
    g.drawImage(c,(tx*256-ctr.x)*sc+BX+BW/2,(ty*256-ctr.y)*sc+BY+BH/2,256*sc+1,256*sc+1);
  }
  g.lineJoin='round'; g.lineCap='round';
  g.strokeStyle='#3b6f86'; g.lineWidth=2.5;                                  // 海岸線
  for(const ring of D.coast){g.beginPath();ring.forEach((c,i)=>{const ll=[c[1],c[0]];i?g.lineTo(X(ll),Y(ll)):g.moveTo(X(ll),Y(ll))});g.stroke()}
  const trace=(lines,toLL)=>{for(const l of lines){g.beginPath();l.forEach((c,i)=>{const ll=toLL(c);i?g.lineTo(X(ll),Y(ll)):g.moveTo(X(ll),Y(ll))})}};
  const path=(lines,toLL)=>{for(const l of lines){g.beginPath();l.forEach((c,i)=>{const ll=toLL(c);i?g.lineTo(X(ll),Y(ll)):g.moveTo(X(ll),Y(ll))});g.stroke()}};
  const trueLL=c=>[c[1],c[0]], userLL=p=>[p.lat,p.lng];
  g.setLineDash([]); g.strokeStyle='#fff'; g.lineWidth=10; path(D.counties[name].lines,trueLL);   // 白底襯線
  g.setLineDash([22,16]); g.strokeStyle='#2f6fe0'; g.lineWidth=6; path(D.counties[name].lines,trueLL);
  g.setLineDash([]); g.strokeStyle='#fff'; g.lineWidth=11; path(strokes,userLL);
  g.strokeStyle='#e0404a'; g.lineWidth=6; path(strokes,userLL);
  // 圖例
  g.fillStyle='#fffffff0'; g.beginPath(); g.roundRect(BX+18,BY+18,330,92,14); g.fill();
  g.lineWidth=6; g.strokeStyle='#e0404a'; g.beginPath(); g.moveTo(BX+36,BY+48); g.lineTo(BX+96,BY+48); g.stroke();
  g.setLineDash([14,9]); g.strokeStyle='#2f6fe0'; g.beginPath(); g.moveTo(BX+36,BY+82); g.lineTo(BX+96,BY+82); g.stroke(); g.setLineDash([]);
  g.fillStyle='#1f3a3d'; g.font=`700 26px ${FONT}`; g.fillText('你的回答',BX+112,BY+57); g.fillText('正確縣市界',BX+112,BY+91);
  g.restore();

  // 等級＋評語

  g.fillStyle='#fff'; g.textAlign='center'; g.font=`700 28px ${FONT}`; g.fillText('等級',BX+100,905);
  g.font=`800 130px ${FONT}`; g.fillText(rk.l,BX+100,1030); g.textAlign='left';
  let fs=56; g.font=`800 ${fs}px ${FONT}`; while(g.measureText(rk.t).width>760&&fs>30){fs-=2;g.font=`800 ${fs}px ${FONT}`}
  g.fillStyle='#1f3a3d'; g.fillText(rk.t,BX+236,935);
  g.fillStyle='#7b8a8a'; g.font=`600 30px ${FONT}`; g.fillText(`判定寬鬆度：${TOL_LABEL[tol]}・${tol} km`,BX+236,990);
  g.fillText(`出題範圍：${$('o-region').selectedOptions[0].textContent.replace('出題','')}`,BX+236,1038);

  // 分數

  g.fillStyle='#7b8a8a'; g.font=`700 28px ${FONT}`; g.fillText('一致率',BX+36,1148);
  g.fillStyle='#b64a2d'; g.font=`800 120px ${FONT}`; g.fillText(`${r.percent.toFixed(1)}%`,BX+30,1270);
  const rows=[['點數',`${r.points.toLocaleString()} / 100,000`],['精準度',`${r.precision.toFixed(1)}%`],['涵蓋率',`${r.coverage.toFixed(1)}%`]];
  rows.forEach(([k,v],i)=>{
    const y=1160+i*60; g.fillStyle='#7b8a8a'; g.font=`700 28px ${FONT}`; g.textAlign='left'; g.fillText(k,BX+520,y+8);
    g.fillStyle='#1f3a3d'; g.font=`800 40px ${FONT}`; g.textAlign='right'; g.fillText(v,BX+BW-36,y+8);
  });
  g.textAlign='left';

  // 頁尾：遊戲網址與圖資標註
  g.fillStyle='#1f3a3d'; g.beginPath(); g.roundRect(BX,1350,BW,74,18); g.fill();
  g.fillStyle='#fff'; g.textAlign='center'; g.font=`800 34px ${FONT}`;
  g.fillText('縣界王 台灣版　'+SITE_URL,W/2,1399);
  g.fillStyle='#7b8a8a'; g.font=`500 16px ${FONT}`;
  ATTR_IMG.forEach((t,i)=>g.fillText(t,W/2,1450+i*22));
  return cvs;
}
function buildShareText(){

  return `我在「縣界王 台灣版」畫了${name}！
一致率 ${r.percent.toFixed(1)}%（${r.points.toLocaleString()} 點／100,000 點）
等級 ${rk.l}：${rk.t}

隨機抽一個縣市，限時 ${ROUND_SEC} 秒描出它的邊界，你認得出自己家鄉的縣界嗎？

▶ 來玩：${SITE_FULL}

靈感來自日本遊戲「${ORIG_TITLE}」（${ORIG_MAKER}）
${ORIG_URL}`;
}
let shareBlob=null, shareURL=null;
async function share(){
  if(!lastResult||state!=='reveal')return;
  const btn=$('b-share'); btn.disabled=true; const label=btn.firstChild.textContent; btn.firstChild.textContent='產生圖片中… ';
  try{
    const cvs=await buildShareImage();
    shareBlob=await new Promise(res=>cvs.toBlob(res,'image/png'));
    if(shareURL)URL.revokeObjectURL(shareURL); shareURL=URL.createObjectURL(shareBlob);
    $('share-img').src=shareURL; $('sh-text').value=buildShareText();
    const file=new File([shareBlob],`縣界王-${name}.png`,{type:'image/png'});
    $('sh-share').classList.toggle('hidden',!(navigator.canShare&&navigator.canShare({files:[file]})));
    $('sh-copy').classList.toggle('hidden',!(navigator.clipboard&&window.ClipboardItem));
    $('share').classList.remove('hidden');
  }catch(err){toast('產生圖片失敗，請再試一次')}
  btn.disabled=false; btn.firstChild.textContent=label;
}
$('sh-close').onclick=()=>$('share').classList.add('hidden');
$('share').addEventListener('click',e=>{if(e.target.id==='share')$('share').classList.add('hidden')});
$('sh-dl').onclick=()=>{const a=document.createElement('a');a.href=shareURL;a.download=`縣界王-${name}.png`;document.body.appendChild(a);a.click();a.remove()};
$('sh-copy').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':shareBlob})]);toast('已複製圖片，可以直接貼上')}catch{toast('這個瀏覽器不支援複製圖片，請改用下載')}};
$('sh-copytext').onclick=async()=>{
  const t=$('sh-text'); try{await navigator.clipboard.writeText(t.value);toast('已複製文字')}catch{t.select();document.execCommand&&document.execCommand('copy');toast('已複製文字')}
};
$('sh-share').onclick=async()=>{
  try{await navigator.share({files:[new File([shareBlob],`縣界王-${name}.png`,{type:'image/png'})],text:$('sh-text').value})}catch{}
};

/* ---------- 綁定 ---------- */
$('b-start').onclick=startRound;
$('b-again').onclick=startRound;
$('b-submit').onclick=submit;
$('b-share').onclick=share;
$('b-undo').onclick=undo; $('b-clear').onclick=clearAll; $('b-fit').onclick=()=>name&&fitStart();
document.querySelectorAll('.tool[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur()});  // 避免按鍵再次觸發剛點過的按鈕
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.metaKey||e.ctrlKey) return;
  const k=e.key.toLowerCase();
  if(state==='play'){ if(k==='d')setMode('draw'); else if(k==='f')setMode('pan'); else if(k==='e')setMode('erase'); else if(k==='z')undo(); else if(k==='enter')submit() }
  else if(state==='reveal'&&k==='enter')startRound();
});
const prefs=store.get(PKEY,{}); if(REGIONS[prefs.region])$('o-region').value=prefs.region; if(['10','5','2'].includes(prefs.tol))$('o-tol').value=prefs.tol;

sizeCanvas(); setMode('pan'); show('menu');
})();
</script>
